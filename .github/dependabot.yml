version: 2

updates:
  # Keeps the workflows off deprecated runner images and Node versions. This is
  # the rot that made every job warn and, once a dev dependency picked up an
  # advisory, fail.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The grumphp shell task runs `composer audit --no-dev --locked`, so the
  # build fails only on advisories against runtime dependencies. Dev
  # dependency updates are grouped and monthly to keep them to one PR.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
